[package]
name = "wire"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "2", features = ["gzip", "brotli"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
zstd = "0.13"
sha2 = "0.10"
serde_json = "1"
