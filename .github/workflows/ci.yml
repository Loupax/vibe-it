name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # QV8-5: the default build is V8 + media. The scratchy leg downloads the V8 static library at
  # build time; the archive is cached with actions/cache (keyed on the v8 crate version) and
  # pinned by sha256 (the v8 build script refuses any other archive).
  test:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: [scratchy, wire, snag]
    env:
      V8_VERSION: "152.2.0"
      V8_ARCHIVE_NAME: librusty_v8_release_x86_64-unknown-linux-gnu.a.gz
      RUSTY_V8_ARCHIVE_SHA256: b6683e9afcb77fbd8cb2c3acf45d34d52029ab216b332522c95179c12f0fed3c
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        if: matrix.crate == 'scratchy'
        # Headless runner. Dev packages for winit/softbuffer/arboard (X11 and
        # Wayland client libs, xkbcommon), fontconfig/freetype, clang and
        # pkg-config for C builds (rquickjs, QuickJS job). The ONE pinned font set is
        # fonts-liberation (see scratchy/tools/README).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            fonts-liberation
      - name: Rust toolchain (pinned, the clippy count depends on the version)
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy
          rustup default 1.96.1
          rustc --version
          cargo clippy --version
      - name: V8 archive cache
        if: matrix.crate == 'scratchy'
        id: v8cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/v8-archive
          key: v8-archive-${{ env.V8_VERSION }}-${{ env.RUSTY_V8_ARCHIVE_SHA256 }}
      - name: V8 archive (download on cache miss, verify the pin always)
        if: matrix.crate == 'scratchy'
        run: |
          d="$RUNNER_TEMP/v8-archive"
          mkdir -p "$d"
          f="$d/$V8_ARCHIVE_NAME"
          if [ ! -f "$f" ]; then
            curl -fsSL --retry 5 -o "$f" \
              "https://github.com/denoland/rusty_v8/releases/download/v${V8_VERSION}/${V8_ARCHIVE_NAME}"
          fi
          echo "$RUSTY_V8_ARCHIVE_SHA256  $f" | sha256sum -c -
          echo "RUSTY_V8_ARCHIVE=$f" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.crate }}
      - name: Build
        run: cargo build --release --locked --all-targets
      - name: Test (scratchy, only the Liberation fonts visible)
        if: matrix.crate == 'scratchy'
        run: |
          export FONTCONFIG_FILE="$(tools/ci-fontconfig.sh /usr/share/fonts/truetype/liberation "$RUNNER_TEMP/fc")"
          fc-match sans-serif
          fc-match monospace
          cargo test --release --locked
      - name: Test
        if: matrix.crate != 'scratchy'
        run: cargo test --release --locked
      - name: Clippy warning count vs baseline (default config, V8 + media)
        if: matrix.crate == 'scratchy'
        run: |
          out="$(tools/clippy-count.sh)"
          echo "$out"
          total="$(echo "$out" | awk '/^TOTAL/ {print $2}')"
          base="$(tr -d '[:space:]' < tools/clippy-baseline.txt)"
          echo "clippy total=$total baseline=$base"
          test -n "$total" && [ "$total" -le "$base" ]
  # QV8-5: the QuickJS fallback config (until QV8-6 removes it): scratchy built and tested with
  # `--no-default-features --features engine-quickjs,media`. The clippy count now runs in the
  # `scratchy` job on the default config (QV8-5b).
  scratchy-quickjs:
    name: scratchy-quickjs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scratchy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            fonts-liberation
      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy
          rustup default 1.96.1
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scratchy
          key: engine-quickjs
      - name: Build (engine-quickjs)
        run: cargo build --release --locked --all-targets --no-default-features --features engine-quickjs,media
      - name: Test (engine-quickjs, only the Liberation fonts visible)
        run: |
          export FONTCONFIG_FILE="$(tools/ci-fontconfig.sh /usr/share/fonts/truetype/liberation "$RUNNER_TEMP/fc")"
          fc-match sans-serif
          fc-match monospace
          cargo test --release --locked --no-default-features --features engine-quickjs,media
