name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # QWPT11: only PR runs are superseded. Pushes to main get their own group per commit and are never cancelled, so
  # every merge's WPT gate result is seen (back-to-back merges used to cancel each other's main run).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Path filter (user 2026-11-23): run only the jobs for crates the change touches. wire2/ runs only the wire2 job (W2-1); web/shell/ runs only the
  # web/shell job (C2); a .github/ change runs everything; the rest of web/ (host-cef needs a ~380 MB CEF download),
  # coordinator/ and root docs run nothing but this job. Base: the PR's merge base, or the
  # previous main commit on a push (an unknown base, e.g. a new branch or a force push, runs everything). Skipped jobs show as "skipped" checks;
  # coordinator/merge_pr.sh accepts those and requires this job to have succeeded.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.f.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -u
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=$(git merge-base "$PR_BASE" HEAD 2>/dev/null || true)
          elif ! echo "$PUSH_BEFORE" | grep -qE '^0+$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then base=$PUSH_BEFORE; fi
          if [ -z "$base" ]; then files=ALL; else files=$(git diff --name-only "$base" HEAD); fi
          echo "base=${base:-none}"; echo "$files"
          all=n; echo "$files" | grep -qE '^(ALL$|\.github/)' && all=y
          has() { [ $all = y ] || echo "$files" | grep -qE "$1"; }
          crates=()
          has '^snag/' && crates+=('"snag"')
          has '^wire2/' && crates+=('"wire2"')
          has '^web/shell/' && crates+=('"web/shell"')
          list="[$(IFS=,; echo "${crates[*]-}")]"
          echo "crates=$list" | tee -a "$GITHUB_OUTPUT"
  test:
    name: ${{ matrix.crate }}
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages (web/shell)
        if: matrix.crate == 'web/shell'
        # smithay links libxkbcommon; Wayland, X11 and EGL libraries are loaded at run time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Rust toolchain (pinned, the clippy count depends on the version)
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.1
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            ${{ matrix.crate }}
      - name: Format (web/shell)
        if: matrix.crate == 'web/shell'
        run: cargo fmt --check
      - name: Build
        run: cargo build --release --locked --all-targets
      - name: Test
        run: cargo test --release --locked
      - name: Clippy, no warnings (wire2, web/shell)
        if: matrix.crate == 'wire2' || matrix.crate == 'web/shell'
        run: cargo clippy --release --locked --all-targets -- -D warnings
