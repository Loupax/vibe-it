[package]
name = "scratchy"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.4"
base64 = "0.22"
cosmic-text = "0.19.0"
cssparser = "0.38.0"
cssparser-color = "0.6.0"
encoding_rs = "0.8"
fontdb = "0.23.0"
html5ever = "0.39"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
markup5ever_rcdom = "0.39.0"
precomputed-hash = "0.1.1"
resvg = { version = "0.50.0", default-features = false }
roxmltree = "0.21"
rquickjs = { version = "=0.14.0", features = ["loader"] }
selectors = "0.41.0"
signal-hook = "0.3.17"
softbuffer = "0.4.8"
sys-locale = "0.3.2"
url = "2"
winit = "0.30.13"
libloading = { version = "0.8", optional = true }
# QV8-3a: V8 (rusty_v8). Off by default; its build script downloads a prebuilt static library at
# BUILD time (user OK 2026-11-18); V8 never opens a socket at run time.
v8 = { version = "=152.2.0", optional = true }

[features]
# QM1f: the real media backend (libmpv by dlopen). Off by default: without it
# <video>/<audio> keep the inert placeholder.
media = ["dep:libloading"]
# QV8-3a: the V8 engine backend (src/js_engine_v8.rs) instead of QuickJS (src/js_engine.rs).
engine-v8 = ["dep:v8"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "layout"
harness = false
