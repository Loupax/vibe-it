<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fx perf</title>
<style>
body{margin:0;font:16px sans-serif;background:#223}
.bar{position:fixed;left:0;top:0;right:0;height:64px;background:rgba(255,255,255,.25);backdrop-filter:blur(12px) saturate(1.4);z-index:5;color:#fff;text-shadow:0 1px 3px #000;padding:20px;box-sizing:border-box;font-size:22px}
.row{display:flex;gap:12px;padding:12px}
.card{flex:1;height:160px;border-radius:12px;color:#fff;padding:12px;box-sizing:border-box;text-shadow:1px 2px 4px rgba(0,0,0,.8)}
.card:nth-child(1){background:#c33;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.card:nth-child(2){background:#3c3;filter:blur(1px) brightness(1.1)}
.card:nth-child(3){background:#33c;filter:grayscale(.6)}
.card:nth-child(4){background:#cc3;mix-blend-mode:multiply}
.glass{margin:12px;height:120px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);border-radius:16px;padding:16px;color:#fff}
.hid{position:absolute;clip-path:inset(50%);width:1px;height:1px}
</style></head><body>
<div class="bar">Frosted bar</div>
<div style="height:80px"></div>
<script>
let h='';for(let i=0;i<60;i++){h+='<div class="row"><div class="card">Card '+i+'a</div><div class="card">Card '+i+'b</div><div class="card">Card '+i+'c</div><div class="card">Card '+i+'d</div></div><div class="glass">Glass panel '+i+'</div>';}
document.body.insertAdjacentHTML('beforeend',h);
</script>
</body></html>
