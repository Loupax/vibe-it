<!doctype html>
<meta charset="utf-8">
<title>opener</title>
<style>
 body { margin: 0; font: 20px sans-serif; background: #ffd; }
 .b { position: absolute; left: 20px; width: 360px; height: 70px; font: 20px sans-serif; display: block; text-align: center; line-height: 70px; border: 2px solid #333; background: #eee; color: #000; text-decoration: none; padding: 0; }
 #gesture { top: 20px } #blank { top: 110px } #noopener { top: 200px } #late { top: 290px }
 iframe { position: absolute; left: 420px; top: 20px; width: 400px; height: 300px; border: 2px solid #393; }
</style>
<button class="b" id="gesture">window.open popup</button>
<a class="b" id="blank" href="child.html?n=blank" target="_blank">target=_blank</a>
<button class="b" id="noopener">window.open noopener</button>
<button class="b" id="late">late timer (7 s)</button>
<iframe src="frame.html"></iframe>
<script>
// C4-SPIKE popups: a gesture popup, a target=_blank link, a noopener popup and timer popups.
const log = (m) => console.log('opener: ' + m);
const open = (tag, url, name, feat) => {
  const w = window.open(url, name, feat);
  log(`${tag} window.open -> ${w ? 'window' : 'null'}`);
  window['w_' + tag] = w;
};
document.getElementById('gesture').onclick = () => open('gesture', 'child.html?n=gesture', 'kid', 'popup,width=400,height=300');
document.getElementById('noopener').onclick = () => open('noopener', 'child.html?n=noopener', '_blank', 'noopener');
document.getElementById('late').onclick = () => setTimeout(() => open('late', 'child.html?n=late', 'latekid', ''), 7000);
setTimeout(() => open('timer', 'child.html?n=timer', 'tkid', 'popup,width=500,height=400'), 1500);
addEventListener('message', (e) => { log(`message from ${e.origin}: ${e.data}`); document.title = 'opener got ' + e.data; });
</script>
