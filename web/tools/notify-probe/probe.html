<!doctype html>
<meta charset="utf-8">
<title>notify-probe</title>
<!-- C-BELL spike: what do Web Notifications do in web-host-cef? Served by serve.py from 127.0.0.1
     (a secure context). Every finding is a console line `notify-probe: <key> = <json>` and the
     whole run is POSTed to serve.py, which saves OUT/<tag>.json. ?tag=NAME names the run;
     ?click=1 waits for a click on the big button (a user gesture) before asking for permission;
     ?delay=MS starts after MS; ?burst=N sends N more at the end (C-BELL). -->
<body style="font: 16px sans-serif">
<button id="go" style="font-size: 32px; width: 100%; height: 300px">ask for notifications</button>
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const tag = q.get('tag') || 'run';
const res = {tag};
const out = document.getElementById('out');
function note(k, v) {
  res[k] = v;
  const line = 'notify-probe: ' + k + ' = ' + JSON.stringify(v);
  console.log(line);
  out.textContent += line + '\n';
}
const timeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r('TIMEOUT ' + ms + 'ms'), ms))]);
async function permState() {
  try { return (await navigator.permissions.query({name: 'notifications'})).state; } catch (e) { return 'error ' + e; }
}
async function run() {
  note('has_Notification', typeof Notification);
  if (typeof Notification === 'undefined') return done();
  note('permission_before', Notification.permission);
  note('query_before', await permState());
  note('request_result', await timeout(Notification.requestPermission().then(r => r, e => 'reject ' + e), 8000));
  note('permission_after', Notification.permission);
  note('query_after', await permState());
  note('ctor', await timeout(new Promise(r => {
    try {
      const n = new Notification('probe title', {body: 'probe body', tag: 'probe-tag'});
      n.onshow = () => r('show');
      n.onerror = () => r('error event');
      n.onclose = () => r('close');
    } catch (e) { r('throw ' + e); }
  }), 4000));
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    note('sw', 'ready');
    note('sw_show', await timeout(reg.showNotification('sw title', {body: 'sw body', tag: 'sw-tag'}).then(() => 'resolved', e => 'reject ' + e), 4000));
    note('sw_get', await timeout(reg.getNotifications().then(l => l.map(n => n.title), e => 'reject ' + e), 4000));
    // From inside the worker (the shim does not reach worker contexts): must fail, nothing to D-Bus.
    note('worker', await timeout(new Promise(r => {
      navigator.serviceWorker.addEventListener('message', e => r(e.data), {once: true});
      reg.active.postMessage('notify');
    }), 4000));
  } catch (e) { note('sw', 'error ' + e); }
  // A fresh about:blank iframe's Notification (a page script could take a pristine API from there).
  try {
    const f = document.body.appendChild(document.createElement('iframe'));
    const N = f.contentWindow.Notification;
    note('iframe_permission', N.permission);
    note('iframe_ctor', await timeout(new Promise(r => {
      try { const n = new N('iframe title', {body: 'iframe body', tag: 'iframe-tag'}); n.onshow = () => r('show'); n.onerror = () => r('error event'); }
      catch (e) { r('throw ' + e); }
    }), 4000));
  } catch (e) { note('iframe', 'error ' + e); }
  // ?burst=N: N more at once (the host's rate limit passes the first few).
  const burst = +(q.get('burst') || 0);
  for (let i = 1; i <= burst; i++) new Notification('burst ' + i, {body: 'line one\nline two', tag: 'burst'});
  if (burst) note('burst', burst);
  done();
}
function done() {
  note('done', true);
  fetch('/result?tag=' + encodeURIComponent(tag), {method: 'POST', body: JSON.stringify(res)}).catch(() => {});
}
if (q.get('click') === '1') document.getElementById('go').onclick = () => run();
else if (q.get('delay')) setTimeout(run, +q.get('delay'));  // C-BELL live: notify from a hidden buffer
else run();
</script>
