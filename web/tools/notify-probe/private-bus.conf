<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- C-BELL spike: a private session bus with NO service activation (no <servicedir>, no
     <standard_session_servicedirs/>), so nothing real (xdg-desktop-portal, a notification
     daemon) is started on it; only fake_notifyd.py owns org.freedesktop.Notifications. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
