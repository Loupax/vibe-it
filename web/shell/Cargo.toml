[package]
name = "web"
version = "0.0.0"
edition = "2021"
publish = false
description = "web-shell: the browser's compositor shell (web/TODO.txt C2, C3)"

# Own workspace root, like host-cef: joins no other build.
[workspace]

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "desktop", "wayland_frontend", "renderer_gl"] }
# The same calloop as smithay's, with signals (SIGTERM/SIGINT quit the host cleanly).
calloop = { version = "0.14", features = ["signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# C3: the status bar's text (as in scratchy: cosmic-text shapes and rasterizes, tiny-skia fills).
cosmic-text = "0.19"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# C3: `:go`'s relative forms and the history ranking (site roots).
url = "2"
# C6: the host desktop's clipboard and primary selection (as alacritty): smithay-clipboard on Wayland
# (the shell window's own connection, core wl_data_device: works on every Wayland desktop),
# x11-clipboard on X11.
copypasta = "0.10"
# C6: the clipboard thread blocks SIGTERM/SIGINT (they are for the main loop's signalfd).
libc = "0.2"
