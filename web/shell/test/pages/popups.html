<!doctype html>
<meta charset="utf-8">
<title>pp start</title>
<style>
  /* C-POPUPS live check (c_popups_live.py). Red page: the opener. Its title reports what it saw:
     `pp <window.open results> | <messages from popups>`. */
  html, body { margin: 0; font: 20px sans-serif; background: #ff0000; }
  .box { position: absolute; left: 40px; width: 300px; height: 80px; line-height: 80px; text-align: center;
         border: 2px solid #345; background: #fff; }
  #btn { top: 40px; } #blank { top: 160px; }
  iframe { position: absolute; left: 40px; top: 280px; width: 300px; height: 80px; border: 2px solid #345; }
</style>
<button id="btn" class="box" type="button">window.open popup</button>
<a id="blank" class="box" href="popchild.html?n=blank" target="_blank">target=_blank link</a>
<iframe src="popframe.html"></iframe>
<script>
  const st = { opened: [], msgs: [] };
  const show = () => { document.title = 'pp ' + st.opened.join(',') + ' | ' + st.msgs.join(','); };
  const open = (n, name, features) => {
    const w = window.open('popchild.html?n=' + n, name, features);
    st.opened.push(n + '=' + (w ? 'win' : 'null'));
    show();
  };
  // With a user gesture: a popup window (features), which becomes a buffer.
  document.getElementById('btn').onclick = () => open('click', 'kid', 'popup,width=400,height=300');
  // No user gesture ever: blocked by the host.
  setTimeout(() => open('timer', 'tkid', ''), 800);
  addEventListener('message', e => { st.msgs.push(String(e.data)); show(); });
  show();
</script>
