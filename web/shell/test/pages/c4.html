<!doctype html>
<meta charset="utf-8">
<title>c4</title>
<style>
  /* C4 live check (c4_live.py): ?c=<colour>&n=<name>. The page's colour tells the screenshots which
     buffer is shown; the title says whether the host shows or hides the page: `<name> visible`. */
  html, body { margin: 0; font: 20px sans-serif; }
  p { margin: 40px; }
  #far { margin-top: 1600px; }
</style>
<p>needle one <a id="link" href="c4.html?c=yellow&n=linked">a link (middle-click, Ctrl-click: nothing opens)</a></p>
<p>needle two</p>
<p id="far">needle three</p>
<script>
  const q = new URLSearchParams(location.search);
  document.body.style.background = q.get('c') || 'white';
  const name = q.get('n') || 'c4';
  const show = () => { document.title = name + ' ' + document.visibilityState; };
  show();
  document.addEventListener('visibilitychange', show);
</script>
