<!doctype html>
<meta charset="utf-8">
<title>c6 loading</title>
<style>
  body { margin: 0; font: 20px sans-serif; }
  #t { position: absolute; left: 40px; top: 40px; width: 500px; height: 80px; font-size: 20px; }
  p { position: absolute; left: 40px; top: 160px; }
</style>
<textarea id="t">copied in the page 7</textarea>
<p>web C6 live check: the title reports the field's value.</p>
<script>
  // The title: "c6 v=<the field's value>" (newlines as |).
  const t = document.getElementById("t");
  const show = () => { document.title = "c6 v=" + t.value.replace(/\n/g, "|"); };
  t.addEventListener("input", show);
  show();
  // C-CLIPTYPES: a copy in the field offers text/plain and text/html (the selection in <b>).
  t.addEventListener("copy", (e) => {
    const sel = t.value.substring(t.selectionStart, t.selectionEnd);
    e.clipboardData.setData("text/plain", sel);
    e.clipboardData.setData("text/html", "<b>" + sel + "</b>");
    e.preventDefault();
  });
  // C-CLIPTYPES: a paste without text (an image) is reported in the title:
  // "c6 paste types=<clipboardData.types> file=<type>:<size> v=<the field's value>".
  t.addEventListener("paste", (e) => {
    const types = Array.from(e.clipboardData.types);
    const files = Array.from(e.clipboardData.files);
    if (!files.length && types.includes("text/plain")) return;
    const file = files.length ? files[0].type + ":" + files[0].size : "none";
    setTimeout(() => {
      document.title = "c6 paste types=" + types.join(",") + " file=" + file + " v=" + t.value.replace(/\n/g, "|");
    }, 50);
  });
</script>
