[package]
name = "wire2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local forward proxy whose traffic streams through a chain of external filters (see SPEC.md)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wire2"
path = "src/main.rs"

# The reference filter `pass` (SPEC "Reference filter: pass"). Not called `pass`: that name belongs to
# the password manager and would shadow it on PATH.
[[bin]]
name = "wire2-pass"
path = "src/bin/pass.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "sync"] }
tokio-util = "0.7"
httparse = "1"
idna = "1"
libc = "0.2"
# W2-2 TLS interception: rustls (ring backend, no C toolchain needed), certificates minted with rcgen
# (x509-parser to reload an existing CA), upstream roots from the system store.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls-native-certs = "0.8"
time = "0.3"
# W2-F: the filter handshake answer is JSON.
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
